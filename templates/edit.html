
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Product | Stockly</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container narrow">
    <div class="card">
        <a href="{{ url_for('index') }}" class="back-link">← Back to Dashboard</a>
        <h1>Edit Product</h1>
        <p class="muted">Update product information and reorder settings.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="alert error">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST"
              action="{{ url_for('update_product', product_id=product._id) }}"
              class="edit-form">

            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <label>Product Name</label>
            <input name="name" value="{{ product.name }}" required>

            <label>Category</label>
            <input name="category" value="{{ product.category }}" required>

            <label>Quantity</label>
            <input name="quantity" type="number" min="0"
                   value="{{ product.quantity }}" required>

            <label>Unit Price (₹)</label>
            <input name="price" type="number" min="0" step="0.01"
                   value="{{ product.price }}" required>

            <label>Reorder Level</label>
            <input name="reorder_level" type="number" min="0"
                   value="{{ product.reorder_level }}" required>

            <label>Product Image URL</label>
            <input name="image_url" type="url"
                   value="{{ product.image_url }}">

            <img class="edit-preview" src="{{ product.image_url }}"
                 alt="{{ product.name }}">

            <button type="submit" class="btn full">Save Changes</button>
        </form>
    </div>
</div>
</body>
</html>
